name: Import Sprint 1 handoff

on:
  push:
    branches:
      - sprint1-implementation

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[sprint1-handoff-import]')"
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify handoff ZIP
        run: |
          test -f sprint1-handoff.zip
          echo '13c8c65f79caf2bac2b9d9ffe1dc1e31439abdf9d44c64a4df6cea27bdd2d8f4  sprint1-handoff.zip' | sha256sum -c -

      - name: Extract Sprint 1 files
        run: |
          rm -rf /tmp/sprint1-handoff
          mkdir -p /tmp/sprint1-handoff
          unzip -q sprint1-handoff.zip -d /tmp/sprint1-handoff

          root=/tmp/sprint1-handoff/sprint1-handoff

          test -f "$root/server.js"
          test -f "$root/okanagan.html"
          test -f "$root/public/styles/tokens.css"
          test -f "$root/public/styles/app.css"
          test -f "$root/public/scripts/app.js"
          test -f "$root/tests/server.test.js"
          test -f "$root/package.json"
          test -f "$root/SPRINT1-MANIFEST.txt"

          cp "$root/server.js" server.js
          cp "$root/okanagan.html" okanagan.html
          cp "$root/public/styles/tokens.css" public/styles/tokens.css
          cp "$root/public/styles/app.css" public/styles/app.css
          cp "$root/public/scripts/app.js" public/scripts/app.js
          cp "$root/tests/server.test.js" tests/server.test.js
          cp "$root/package.json" package.json
          cp "$root/SPRINT1-MANIFEST.txt" SPRINT1-MANIFEST.txt

      - name: Verify Sprint 1 manifest
        run: |
          grep -q '81f1f7023fa27e829865e2667d37fd954dbc6eae' SPRINT1-MANIFEST.txt

      - name: Remove temporary handoff files
        run: |
          rm -f sprint1-handoff.zip
          rm -f .github/workflows/import-sprint1-handoff.yml

      - name: Commit Sprint 1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add server.js
          git add okanagan.html
          git add public/styles/tokens.css
          git add public/styles/app.css
          git add public/scripts/app.js
          git add tests/server.test.js
          git add package.json
          git add SPRINT1-MANIFEST.txt

          git add -u

          git commit -m 'Import verified Sprint 1 implementation [sprint1-handoff-import]'
          git push origin HEAD:sprint1-implementation
